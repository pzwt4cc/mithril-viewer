[package]
name = "mithril-viewer"
version = "0.1.0"
edition = "2024"
description = "Fast, minimal GPU-accelerated image viewer"
license = "MIT"
readme = "README.md"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
fontdue = "0.9.5"
glow = "0.18.0"
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
libc = "0.2.191"
trash = "5.2.9"
winit = "0.30"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
